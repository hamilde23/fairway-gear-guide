<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102d28"><meta name="description" content="Play nine holes of single-player arcade golf modeled on Colfax Golf Course, Washington."><title>Colfax Golf Arcade | Fairway Gear Guide</title><link rel="canonical" href="https://www.fairwaygearguide.com/games/colfax-golf/"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">⚑</span><span>COLFAX<small>GOLF ARCADE</small></span></a><a class="location home-link" href="/">← FAIRWAY GEAR GUIDE</a><nav><button id="sound" aria-label="Toggle sound" aria-pressed="false">Sound off</button><button id="help">How to play</button><button id="scorecard">Scorecard <span>↗</span></button></nav></header>
<main id="game"><canvas id="course" tabindex="0" aria-label="Golf course. Click or tap to aim. Arrow keys adjust aim and power. Set power with the slider. Space starts the swing; press again for accuracy."></canvas>
<div class="hud"><div class="hole-info"><span class="eyebrow">COLFAX GOLF COURSE</span><div class="hole-title">HOLE <strong id="hole">01</strong><span class="hole-meta">PAR <b id="par">4</b><br><b id="yardage">366</b> YDS</span></div><div class="hole-progress" id="progress"></div></div><div class="round-info"><span class="eyebrow">YOUR ROUND</span><strong id="total">E</strong><span id="shot-count">SHOT 1</span></div></div>
<div class="map-tools"><button id="overview" title="Toggle full course view">⛶ <span>Course map</span></button><button id="pin" title="Aim toward the pin">⚑ <span>Aim at pin</span></button></div>
<div class="lie-info"><span id="lie">TEE BOX</span><strong id="distance">366 <small>yd to pin</small></strong><span id="wind">↗ WIND 4 MPH</span></div>
<div id="toast" role="status" aria-live="polite">Welcome to Colfax. Pick your line.</div>
<div class="shot-panel"><div class="club-block"><label for="club">YOUR CLUB</label><select id="club"><option value="0">Driver · 260 yd</option><option value="1">3 Wood · 225 yd</option><option value="2">5 Iron · 180 yd</option><option value="3">7 Iron · 150 yd</option><option value="4">9 Iron · 120 yd</option><option value="5">Wedge · 75 yd</option><option value="6">Putter · 30 yd</option></select><span id="carry">Estimated total: 247 yd</span></div><div class="power-block"><div class="power-label"><label for="power">SHOT POWER</label><strong id="power-value">95%</strong></div><input id="power" type="range" min="1" max="100" value="95"><div class="timing" id="timing"><span class="sweet"></span><span id="needle"></span></div><div class="timing-label"><span id="swing-hint">Click the course to aim</span><span id="accuracy-hint">SPACE TO SWING</span></div></div><button id="swing" class="primary">Swing <span>↗</span></button></div>
<div class="bottom-note"><span>9 HOLES · PAR 35 · 3,010 YARDS</span><button id="about">About this recreation</button></div>
</main>
<dialog id="modal"><button id="close-modal" class="close" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog>
<script src="course.js"></script><script src="game.js"></script></body></html>
